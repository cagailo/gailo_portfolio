<html>
<head>
    <title>Student Event Registration Form</title>
</head>

<body>

    <h1>Student Event Registration Form</h1>
		<p>Please complete the form below to register for the upcomming student event</p>
		
    <form>

        <h2>Personal Information</h2>

        <label for="fname">Full Name:</label>
		<br>
        <input type="text" id="fname" name="fname">
        <br><br>

        <label for="studentid">Student Number:</label>
		<br>
        <input type="text" id="studentid" name="studentid">
        <br><br>

        <label for="email">Email Address:</label>
		<br>
        <input type="email" id="email" name="email">
        <br><br>
        
		<label for="pass">Password:</label>
		<br>
        <input type="text" id="pass" name="pass">
        <br><br>


        <label for="birthday">Date of Birth:</label>
		<br>
        <input type="date" id="birthday" name="birthday">
        <br><br>
		
		   <p>Academic Information:</p>

        <input type="radio" id="first" name="year" value="first">
        <label for="first">First Year</label>

        <input type="radio" id="second" name="year" value="second">
        <label for="second">Second Year</label>
<br>
        <input type="radio" id="third" name="year" value="third">
        <label for="third">Third Year</label>

        <input type="radio" id="fourth" name="year" value="fourth">
        <label for="fourth">Fourth Year</label>

        <br><br>
		

        <label for="prog">Program:</label>
		<br>
        <select id="prog" name="prog">
            <option value="IT">IT</option>
            <option value="BMA">Multimedia Arts</option>
            <option value="ENG">Engineering</option>
            <option value="ARTS">Fine Arts</option>
        </select>
        <br><br>
		
		
		 <h2>Event Preferences:</h2>
			<p>Sessions You Want to Attend:</p>
        <input type="checkbox" id="web" name="activities" value="web">
        <label for="web">Web Development</label>
        <br>

        <input type="checkbox" id="uu" name="activities" value="uu">
        <label for="uu">UI/UX Design</label>
        <br>

        <input type="checkbox" id="cyb" name="activities" value="cyb">
        <label for="cyb">Cybersecurity</label>
        <br>

        <input type="checkbox" id="AI" name="activities" value="AI">
        <label for="AI">Artificial Intelligence</label>

        <br><br>
		
		        <label for="prog"> Preferred Schedule: </label>
		<br>
        <select id="prog" name="prog">
            <option value="mor">Morning Session - 9:00 AM</option>
            <option value="l">Lunch Session - 12:00 PM</option>
            <option value="a">Afternoon Session - 3:00 PM</option>
            <option value="n">Night Session - 6:00 PM</option>
        </select>
		
				   <p>Participation Type:</p>

        <input type="radio" id="OS" name="PART" value="OS">
        <label for="OS">On-site </label>

        <input type="radio" id="ON" name="PART" value="ON">
        <label for="ON">Online</label>
        <br><br>
		<h2> Additional Information</h2>
		
		        <label for="comments">Why do you want to attend this event?</label>
        <br>
        <textarea id="comments" name="comments" rows="5" cols="40"></textarea>

        <br><br>


        <input type="submit" value="Submit Registration">
        <input type="reset" value="Clear Form">
		    </form>

</body>
</html>
